<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Trainer — FitPulse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#7c3aed" />
<link rel="stylesheet" href="/css/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="app-body">

  <aside class="sidebar">
    <div class="logo">💪 FitPulse</div>
    <nav>
      <a href="/dashboard.html">🏠 Dashboard</a>
      <a href="/ai-trainer.html" class="active">🤖 AI Trainer</a>
      <a href="/planner.html">📅 Planner</a>
      <a href="/library.html">📚 Library</a>
      <a href="/progress.html">📊 Progress</a>
      <a href="/leaderboard.html">🏆 Leaderboard</a>
    </nav>
    <button id="logoutBtn" class="btn-ghost logout">Logout</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>AI Trainer 🤖</h1>
      <button id="restartBtn" class="btn-ghost">↻ Start Over</button>
    </header>

    <div class="chat-container">
      <div id="chatMessages" class="chat-messages"></div>

      <div id="chatOptions" class="chat-options"></div>

      <form id="chatForm" class="chat-input-row" style="display:none">
        <input type="text" id="chatInput" placeholder="Type your answer..." autocomplete="off" />
        <button type="submit" class="btn-primary">Send</button>
      </form>

      <div id="chatTyping" class="chat-typing" style="display:none">
        <span></span><span></span><span></span>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ai-engine.js"></script>
  <script src="/js/ai-trainer.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
