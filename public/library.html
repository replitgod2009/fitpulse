<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exercise Library — FitPulse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>" />
<link rel="stylesheet" href="/css/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="logo">💪 FitPulse</div>
    <nav>
      <a href="/dashboard.html">🏠 Dashboard</a>
      <a href="/planner.html">📅 Planner</a>
      <a href="/library.html" class="active">📚 Library</a>
      <a href="/progress.html">📊 Progress</a>
      <a href="/leaderboard.html">🏆 Leaderboard</a>
    </nav>
    <button id="logoutBtn" class="btn-ghost logout">Logout</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>Exercise Library 📚</h1>
      <div style="display:flex;gap:10px;align-items:center">
        <input type="text" id="searchEx" placeholder="Search exercises..." class="search" />
        <a href="/planner.html" id="openPlannerBtn" class="btn-primary" style="display:none">Open planner (<span id="queueCount">0</span>)</a>
      </div>
    </header>

    <div class="filters" id="filters">
      <button class="chip active" data-cat="all">All</button>
      <button class="chip" data-cat="cardio">Cardio</button>
      <button class="chip" data-cat="strength">Strength</button>
      <button class="chip" data-cat="yoga">Yoga</button>
      <button class="chip" data-cat="hiit">HIIT</button>
      <button class="chip" data-cat="core">Core</button>
    </div>

    <section id="exerciseGrid" class="exercise-grid"></section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/library.js"></script>
</body>
</html>
