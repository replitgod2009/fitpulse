<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Planner — FitPulse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#7c3aed" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="FitPulse" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/workout-features.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="app-body">

  <aside class="sidebar">
    <div class="logo"><img class="app-logo" src="/assets/fitpulse-lockup.png" alt="FitPulse" /></div>
    <nav>
      <a href="/dashboard.html">🏠 Dashboard</a>
      <a href="/ai-trainer.html">🤖 AI Trainer</a>
      <a href="/planner.html" class="active">📅 Planner</a>
      <a href="/library.html">📚 Library</a>
      <a href="/progress.html">📊 Progress</a>
      <a href="/leaderboard.html">🏆 Leaderboard</a>
    </nav>
    <button id="logoutBtn" class="btn-ghost logout">Logout</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1><span data-theme-label="questLabel">Daily Quest</span> Planner 📅</h1>
      </div>
      <button type="button" class="btn-ghost theme-picker-trigger" data-theme-picker>⚔ Theme</button>
    </header>

    <section class="panel">
      <h3>Build your workout</h3>
      <form id="workoutForm">
        <input type="text" id="wName" placeholder="Workout name (e.g., Morning Cardio)" required />
        <div id="exerciseList"></div>
        <button type="button" id="addExercise" class="btn-ghost">+ Add Exercise</button>
        <button type="submit" class="btn-primary">Save Workout</button>
      </form>
    </section>

    <section class="panel">
      <h3>Your saved workouts</h3>
      <div id="workoutsContainer" class="workouts-list"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/themes/themes.js"></script>
  <script src="/themes/theme-picker.js"></script>
  <script src="/js/planner.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
